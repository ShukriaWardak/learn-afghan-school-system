name: Backend and frontend syntax checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/live-admin-integration
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check live.js
          node --check registry.js
          node --check students.js
          node --check attendance.js
          node --check personnel-attendance.js
          node --check reports.js
          node --check approvals.js
          node --check dashboard-reference.js
      - name: PHP syntax
        run: |
          php -l check-setup.php
          php -l reset-local-login.php
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Report and CSV behavior
        run: |
          node tests/branch-export.cjs
          node tests/live-reports.cjs
          node tests/registry.cjs
          node tests/students.cjs
          node tests/approvals.cjs
      - name: Required files
        run: |
          test -f database/schema.sql
          test -f database/002_login_attempts.sql
          test -f backend/api/branch_update.php
          test -f backend/api/zone_create.php
          test -f backend/api/audit.php
          test -f database/003_personnel.sql
          test -f database/004_students.sql
          test -f database/005_student_attendance.sql
          test -f database/006_personnel_attendance.sql
          test -f backend/api/personnel_attendance.php
          test -f backend/api/personnel_attendance_save.php
          test -f backend/api/reports_summary.php
          test -f backend/api/reports_export.php
          test -f backend/reporting.php
          test -f backend/api/approvals.php
          test -f backend/api/approval_decide.php
          test -f backend/api/attendance.php
          test -f backend/api/attendance_save.php
          test -f check-setup.php
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable database
        env:
          LEARN_INTEGRATION_TEST: '1'
          MYSQL_TEST_PASSWORD: disposable-ci-only
        run: php tests/setup-integration.php
      - name: Test authenticated personnel, department and student APIs
        env:
          LEARN_INTEGRATION_TEST: '1'
          MYSQL_TEST_PASSWORD: disposable-ci-only
        run: |
          php -S 127.0.0.1:8099 -t . > /tmp/learn-php-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/personnel-integration.cjs
          node tests/setup-checks.cjs
          node tests/students-integration.cjs
          node tests/password-reset.cjs
          node tests/first-admin.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test student browser interactions
        env:
          LEARN_INTEGRATION_TEST: '1'
          MYSQL_TEST_PASSWORD: disposable-ci-only
        run: |
          php -S 127.0.0.1:8099 -t . > /tmp/learn-php-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/dashboard-navigation-browser.cjs
          node tests/students-browser.cjs
          node tests/attendance-integration.cjs
          node tests/attendance-browser.cjs
          node tests/personnel-attendance-integration.cjs
          node tests/personnel-attendance-browser.cjs
          node tests/reports-integration.cjs
          node tests/reports-browser.cjs
          node tests/approvals-integration.cjs
          node tests/approvals-browser.cjs
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/learn-php-test.log || true

